name: Android Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-disabled: true

      - name: Download three.js (engine for Joy drone)
        run: |
          mkdir -p app/src/main/assets
          if [ ! -s app/src/main/assets/three.min.js ]; then
            curl -fsSL --retry 5 --retry-delay 3 -o app/src/main/assets/three.min.js \
              https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js
          fi
          test "$(wc -c < app/src/main/assets/three.min.js)" -gt 100000

      - name: Build debug APK
        run: gradle assembleDebug --refresh-dependencies --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: VirtualMouse-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
