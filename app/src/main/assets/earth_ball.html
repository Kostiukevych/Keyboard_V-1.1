var f=j*6.2832/72,cf=Math.cos(f),sf=Math.sin(f),
wx=c[0]*cr+(b.e[0]*cf+b.n[0]*sf)*sr,wy=c[1]*cr+(b.e[1]*cf+b.n[1]*sf)*sr,wz=c[2]*cr+(b.e[2]*cf+b.n[2]*sf)*sr,
vx=M[0]*wx+M[3]*wy+M[6]*wz,vy=M[1]*wx+M[4]*wy+M[7]*wz,vz=M[2]*wx+M[5]*wy+M[8]*wz;
if(vz<0&&vx*vx+vy*vy<1){pen=false;continue}
if(!pen){oc.moveTo(OC+vx*RO,OC-vy*RO);pen=true}else oc.lineTo(OC+vx*RO,OC-vy*RO);
}
oc.lineWidth=(3.4-1.6*age)*UO;oc.strokeStyle='rgba(110,245,255,'+(.8*a).toFixed(3)+')';oc.stroke();
}
}
/* ===== события погоды: спрайты считаются порциями по кадрам, рисует их шейдер ===== */
function stepRows(E){
var dl=performance.now()+3,ok=true,i,L,s,k;
for(i=0;i<E.L.length;i++){
s=E.L[i].spr;if(!s)continue;
if(s.j<s.W){s.row(s.j++);while(s.j<s.W&&performance.now()<dl)s.row(s.j++)}
if(s.j<s.W)ok=false;
}
if(!ok)return;
for(i=0;i<E.L.length;i++){
L=E.L[i];s=L.spr;if(!s)continue;
var n=s.W*s.W,sd=new Uint8Array(n*2);
for(k=0;k<n;k++){sd[2*k]=s.A[k];sd[2*k+1]=s.B[k]}
L.sd=sd;L.W=s.W;L.spr=null;
}
E.ready=true;E.t0=performance.now();dirty=true;
}
function disposeEv(E){
if(!E)return;
for(var i=0;i<E.L.length;i++){var L=E.L[i];if(L.tex&&gl&&!glLost)gl.deleteTexture(L.tex);L.tex=null}
}
function setEv(E){disposeEv(ev);ev=E;nCl=0;CLE=null;dirty=true}
function fillCloud(E,t,la){
var n=E.L.length,i,L,o,al,ca,sa,c,e,nn,ang;
for(i=0;i<n;i++){
L=E.L[i];o=i*3;c=L.c;e=L.e;nn=L.n;
if(L.sp){
al=L.sp*t;ca=Math.cos(al);sa=Math.sin(al);
aC[o]=c[0]*ca+c[2]*sa;aC[o+1]=c[1];aC[o+2]=-c[0]*sa+c[2]*ca;
aE[o]=e[0]*ca+e[2]*sa;aE[o+1]=e[1];aE[o+2]=-e[0]*sa+e[2]*ca;
aN[o]=nn[0]*ca+nn[2]*sa;aN[o+1]=nn[1];aN[o+2]=-nn[0]*sa+nn[2]*ca;
}else{
aC[o]=c[0];aC[o+1]=c[1];aC[o+2]=c[2];aE[o]=e[0];aE[o+1]=e[1];aE[o+2]=e[2];aN[o]=nn[0];aN[o+1]=nn[1];aN[o+2]=nn[2];
}
ang=L.ang+L.om*t;
aP[i*4]=L.rad;aP[i*4+1]=Math.cos(ang);aP[i*4+2]=Math.sin(ang);aP[i*4+3]=la*(L.amp||1);
}
nCl=n;CLE=E;
}
var aurA=0,lastOv=0,ovNeed=true;
/* возвращает true, пока облака анимируются (шару нужна перерисовка каждый кадр) */
function drawFx(now){
var dt=Math.min(.05,(now-lastT)/1000);lastT=now;
if(WEATHER&&!ev&&now>=nextEv)setEv(Math.random()<.55?mkCyclone():mkDrift());
aurA+=((AURORA?1:0)-aurA)*Math.min(1,dt*1.5);
var cloud=false;
if(ev){
if(!ev.ready)stepRows(ev);
else{
var t=(now-ev.t0)/1000;
if(t>ev.dur){setEv(null);nextEv=now+4000+Math.random()*7000}
else{fillCloud(ev,t,Math.max(0,Math.min(1,t/1.5,(ev.dur-t)/2.2)));cloud=true}
}
}
var ovOn=aurA>.01||ripples.length>0;
if(!ovOn){
if(ovDirty){oc.setTransform(1,0,0,1,0,0);oc.clearRect(0,0,OW,OW);ovDirty=false}
}else if(ovNeed||ripples.length||now-lastOv>=41){      /* сияние плавное: в покое ~24 кадр/с, при вращении и ряби — каждый кадр */
lastOv=now;ovNeed=false;
oc.setTransform(1,0,0,1,0,0);oc.globalCompositeOperation='source-over';oc.globalAlpha=1;oc.clearRect(0,0,OW,OW);ovDirty=true;
if(aurA>.01)drawAurora(now/1000,aurA);
if(ripples.length)drawRipples(now);
oc.globalAlpha=1;oc.globalCompositeOperation='source-over';
}
return cloud;
}

var drag=false,lx=0,ly=0,vx=0,vy=0,lt=0,moving=false,pid=null;
function hit(cx,cy){var r=cv.getBoundingClientRect(),k=S/r.width,x=(cx-r.left)*k-C,y=(cy-r.top)*k-C;return Math.hypot(x,y)<=R+40}
function dstart(cx,cy,id){
drag=true;pid=id;lx=cx;ly=cy;vx=vy=0;lt=performance.now();
cv.classList.add('drag');pressing=true;pxc=cx;pyc=cy;try{addRipple(cx,cy)}catch(_){}
}
function dmove(cx,cy){
var r=cv.getBoundingClientRect(),k=S/r.width,dx=(cx-lx)*k,dy=(cy-ly)*k;
lx=cx;ly=cy;pxc=cx;pyc=cy;rot(dx,dy);
vx=vx*.5+dx*.5;vy=vy*.5+dy*.5;lt=performance.now();
}
function dend(){
if(!drag)return;drag=false;pid=null;pressing=false;cv.classList.remove('drag');
if(performance.now()-lt>80)vx=vy=0;
}
if(window.PointerEvent){
document.addEventListener('pointerdown',function(e){
if(drag||(e.pointerType==='mouse'&&e.button!==0)||!hit(e.clientX,e.clientY))return;
dstart(e.clientX,e.clientY,e.pointerId);e.preventDefault();
},{passive:false});
window.addEventListener('pointermove',function(e){
if(drag&&e.pointerId===pid){dmove(e.clientX,e.clientY);e.preventDefault()}
},{passive:false});
window.addEventListener('pointerup',function(e){if(e.pointerId===pid)dend()});
window.addEventListener('pointercancel',function(e){if(e.pointerId===pid)dend()});
}else{
document.addEventListener('touchstart',function(e){
var t=e.changedTouches[0];if(drag||!hit(t.clientX,t.clientY))return;
dstart(t.clientX,t.clientY,t.identifier);e.preventDefault();
},{passive:false});
window.addEventListener('touchmove',function(e){
if(!drag)return;for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];
if(t.identifier===pid){dmove(t.clientX,t.clientY);e.preventDefault();break}}
},{passive:false});
window.addEventListener('touchend',function(e){for(var i=0;i<e.changedTouches.length;i++)if(e.changedTouches[i].identifier===pid)dend()});
window.addEventListener('touchcancel',dend);
document.addEventListener('mousedown',function(e){if(drag||e.button!==0||!hit(e.clientX,e.clientY))return;dstart(e.clientX,e.clientY,'m');e.preventDefault()});
window.addEventListener('mousemove',function(e){if(drag&&pid==='m')dmove(e.clientX,e.clientY)});
window.addEventListener('mouseup',function(){if(pid==='m')dend()});
}
function loop(){
var cl=false;
try{
if(!drag){
if(Math.abs(vx)+Math.abs(vy)>.05){rot(vx,vy);vx*=.95;vy*=.95}
else{vx=vy=0;if(IDLE)rot(IDLE,0)}
}
if(dirty)ovNeed=true;
}catch(e){MSG.style.color='#f88';MSG.textContent='Ошибка: '+e.message}
try{cl=drawFx(performance.now())}catch(e2){setEv(null);ripples=[];WEATHER=false}
try{if(ready&&(dirty||cl)){if(draw())dirty=false}}catch(e3){MSG.style.color='#f88';MSG.textContent='Ошибка: '+e3.message}
requestAnimationFrame(loop);
}
var im=new Image();
im.onload=function(){
TW=im.width;TH=im.height;imgEl=im;
if(gl&&!glLost){try{upEarth()}catch(e){MSG.style.color='#f88';MSG.textContent='Ошибка: '+e.message}}
ready=true;dirty=true;if(gl)MSG.textContent='';
};
im.onerror=function(){MSG.style.color='#f88';MSG.textContent='Не удалось загрузить текстуру Земли'};
im.src=TEX;
look(35,25);
window.EARTH={rot:rot,look:look,
storm:function(){setEv(mkCyclone())},
drift:function(){setEv(mkDrift())},
weather:function(on){WEATHER=!!on},aurora:function(on){AURORA=!!on}};
loop();
})();
</script>
